probe:
  model: logistic_regression
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  random_state: 42

cross_validation:
  n_folds: 5
  stratified: true
  shuffle: true
  random_state: 42

layer_selection:
  strategy: constrained_late
  constraint: upper_half  # only consider layers ℓ in [L/2, L]

hidden_state_extraction:
  positions:
    - end_of_question
    - middle_of_generation
    - pre_answer_marker
    - final_generated_token
  default_position: pre_answer_marker
  fallback_position: penultimate_token  # if no answer marker found

multi_seed:
  seeds: [42, 7, 13, 100, 0]

baselines:
  - mean_logp
  - final_logp
  - mean_entropy_negated
  - max_entropy_negated

probe_vs_baseline:
  gap_threshold: 0.05  # cells with gap >= 0.05 considered probe-favorable

shared_cosine_layer:
  strategy: argmax_avg_indomain_auc_constrained
  per_model:
    qwen3-8b: 26
    llama-3.1-8b: 16
    gemma-2-9b: 41
